<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In &mdash; Portable Sandbox Management System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">PS</div>
        <h1>Portable Sandbox</h1>
        <p>OS Process Supervisor &amp; Telemetry System</p>
      </div>

      <div id="auth-error-alert" class="auth-alert auth-alert-error" role="alert"></div>

      <form id="login-form" autocomplete="on">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input"
            placeholder="Enter your username"
            required
            autocomplete="username"
            autofocus
          >
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.375rem;">
            <label for="password" class="form-label" style="margin-bottom: 0;">Password</label>
          </div>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary auth-submit-btn">
          <span class="btn-text">Sign In</span>
          <span class="spinner btn-spinner" style="display: none;"></span>
        </button>
      </form>

      <div class="auth-security-notice">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <div>
          Authenticated sessions are verified directly against host database records with multi-tenant workspace isolation.
        </div>
      </div>

      <div class="auth-footer">
        Don&apos;t have an account? <a href="{{ url_for('web.register_page') }}" style="font-weight: 600;">Create an account</a>
      </div>
    </div>

    <div class="auth-meta-footer">
      B.Tech CSE/AIML Systems Capstone &bull; WSL2 Ubuntu Engine
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
